<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ error_title or "404 - Halaman Tidak Ditemukan" }} | {{ APP_NAME }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page-body">

  <div class="login-card" style="text-align: center; max-width: 500px;">
    <div style="font-size: 5rem; font-weight: 800; font-family: 'Outfit', sans-serif; background: linear-gradient(135deg, var(--primary), var(--accent-cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1;">
      404
    </div>

    <h2 style="margin-top: 14px; font-size: 1.4rem;">
      {{ error_title or "Halaman Tidak Ditemukan" }}
    </h2>

    <p style="color: var(--text-secondary); font-size: 0.92rem; margin: 12px 0 24px;">
      {{ error_desc or "Halaman yang Anda tuju tidak tersedia atau telah dipindahkan. Silakan kembali ke dashboard utama." }}
    </p>

    <div style="display: flex; gap: 10px; justify-content: center;">
      <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
        <i class="fas fa-home"></i> Kembali ke Dashboard
      </a>
      <a href="{{ url_for('login') }}" class="btn btn-secondary">
        <i class="fas fa-sign-in-alt"></i> Halaman Login
      </a>
    </div>
  </div>

</body>
</html>
